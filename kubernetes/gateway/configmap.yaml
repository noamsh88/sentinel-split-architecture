apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: sentinel-gateway
data:
  # BACKEND_DNS is replaced at deploy time by the CI/CD pipeline with the
  # internal NLB hostname assigned to the backend service.
  default.conf: |
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 'gateway ok\n';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass         http://BACKEND_DNS:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }
    }
